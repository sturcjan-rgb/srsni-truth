name: extract-font

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync

      - run: uv run python3 extract_font.py

      - name: Commitnout font
        run: |
          git config user.name "srsni-bot"
          git config user.email "bot@srsni.local"
          git add static/fonts/cofo-peshka-black.woff2
          git diff --cached --quiet || git commit -m "chore: přidat font CoFo Peshka Black (self-hosted ze Sršni TV)"
          git push
